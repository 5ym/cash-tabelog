name: Fetch ratio

# 定期実行はオフ(食べログが GitHub ホステッドランナーの IP を 403 で拒否するため)。
# 手動実行(workflow_dispatch)のみ残している。取得はローカルの
# `docker compose run --rm fetch` を利用し、push すれば Pages に自動反映される。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ratio
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run fetch
      - name: Commit updated ratio.json
        run: |
          if git diff --quiet ratio.json; then
            echo "ratio.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ratio.json
          git commit -m "Update ratio.json ($(date -u +%Y-%m-%d))"
          git push
